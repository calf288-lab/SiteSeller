<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
  
  <!-- Subtle center glow -->
  <circle cx="32" cy="32" r="22" fill="url(#glow)" />

  <!-- Main AI Sparkle Star (✦) -->
  <path d="M 32 11 C 32 23 23 32 11 32 C 23 32 32 41 32 53 C 32 41 41 32 53 32 C 41 32 32 23 32 11 Z" fill="url(#starGrad)" />

  <!-- Secondary Emerald Accent Sparkle -->
  <circle cx="47" cy="17" r="3.5" fill="#34d399" />
  <circle cx="47" cy="17" r="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6" />
</svg>
